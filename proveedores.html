<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tienda Genérica - Proveedores</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="banner-demo">Modo demo (sin backend ni AWS) — los datos viven en este navegador</div>
  <div class="topbar">
    <h1>Tienda Genérica</h1>
    <nav>
      <a href="usuarios.html">Usuarios</a>
      <a href="clientes.html">Clientes</a>
      <a href="proveedores.html" class="active">Proveedores</a>
      <a href="productos.html">Productos</a>
      <a href="ventas.html">Ventas</a>
      <a href="reportes.html">Reportes</a>
      <a href="index.html">Salir</a>
    </nav>
  </div>

  <div class="container">
    <h2>Gestión de Proveedores</h2>

    <label>NIT</label>
    <input type="text" id="nitProveedor"><br>
    <label>Nombre Proveedor</label>
    <input type="text" id="nombreProveedor"><br>
    <label>Dirección</label>
    <input type="text" id="direccionProveedor"><br>
    <label>Teléfono</label>
    <input type="text" id="telefonoProveedor"><br>
    <label>Ciudad</label>
    <input type="text" id="ciudadProveedor"><br>

    <button onclick="consultar()">Consultar</button>
    <button onclick="crear()">Crear</button>
    <button onclick="actualizar()">Actualizar</button>
    <button onclick="borrar()">Borrar</button>
    <button onclick="listar()">Listar Proveedores</button>

    <div id="mensaje"></div>
    <div id="tablaResultado"></div>
  </div>

  <script src="js/db.js"></script>
  <script>
    function limpiar() {
      ['nitProveedor','nombreProveedor','direccionProveedor','telefonoProveedor','ciudadProveedor'].forEach(id => {
        document.getElementById(id).value = '';
      });
    }
    function mostrarMensaje(texto, tipo) {
      document.getElementById('mensaje').innerHTML = texto ? `<div class="msg ${tipo}">${texto}</div>` : '';
    }
    function armarObjeto() {
      return {
        nitProveedor: Number(document.getElementById('nitProveedor').value),
        nombreProveedor: document.getElementById('nombreProveedor').value,
        direccionProveedor: document.getElementById('direccionProveedor').value,
        telefonoProveedor: document.getElementById('telefonoProveedor').value,
        ciudadProveedor: document.getElementById('ciudadProveedor').value
      };
    }

    function crear() {
      const p = armarObjeto();
      if (!p.nitProveedor || !p.nombreProveedor || !p.direccionProveedor || !p.telefonoProveedor || !p.ciudadProveedor) {
        mostrarMensaje('Faltan datos del proveedor', 'error'); return;
      }
      const lista = DB.get(DB.KEYS.proveedores);
      if (lista.some(x => x.nitProveedor === p.nitProveedor)) {
        mostrarMensaje('Ya existe un proveedor con ese NIT', 'error'); return;
      }
      lista.push(p);
      DB.set(DB.KEYS.proveedores, lista);
      mostrarMensaje('Proveedor Creado', 'ok');
      limpiar();
    }

    function consultar() {
      const nit = document.getElementById('nitProveedor').value;
      if (!nit) { mostrarMensaje('Ingrese el NIT a consultar', 'error'); return; }
      const lista = DB.get(DB.KEYS.proveedores);
      const encontrado = lista.find(x => String(x.nitProveedor) === String(nit));
      if (encontrado) {
        document.getElementById('nombreProveedor').value = encontrado.nombreProveedor || '';
        document.getElementById('direccionProveedor').value = encontrado.direccionProveedor || '';
        document.getElementById('telefonoProveedor').value = encontrado.telefonoProveedor || '';
        document.getElementById('ciudadProveedor').value = encontrado.ciudadProveedor || '';
        mostrarMensaje('Proveedor encontrado', 'ok');
      } else {
        mostrarMensaje('Proveedor Inexistente', 'error');
      }
    }

    function actualizar() {
      const p = armarObjeto();
      if (!p.nitProveedor || !p.nombreProveedor || !p.direccionProveedor || !p.telefonoProveedor || !p.ciudadProveedor) {
        mostrarMensaje('Datos faltantes', 'error'); return;
      }
      let lista = DB.get(DB.KEYS.proveedores);
      const idx = lista.findIndex(x => x.nitProveedor === p.nitProveedor);
      if (idx === -1) { mostrarMensaje('NIT Errado', 'error'); return; }
      lista[idx] = p;
      DB.set(DB.KEYS.proveedores, lista);
      mostrarMensaje('Datos del Proveedor Actualizados', 'ok');
      limpiar();
    }

    function borrar() {
      const nit = document.getElementById('nitProveedor').value;
      let lista = DB.get(DB.KEYS.proveedores);
      const existe = lista.some(x => String(x.nitProveedor) === String(nit));
      if (!existe) { mostrarMensaje('NIT Errado', 'error'); return; }
      lista = lista.filter(x => String(x.nitProveedor) !== String(nit));
      DB.set(DB.KEYS.proveedores, lista);
      mostrarMensaje('Datos del Proveedor Borrados', 'ok');
      limpiar();
    }

    function listar() {
      const lista = DB.get(DB.KEYS.proveedores);
      if (!lista.length) { mostrarMensaje('No existen proveedores registrados', 'error'); document.getElementById('tablaResultado').innerHTML=''; return; }
      mostrarMensaje('', '');
      let html = '<table><tr><th>NIT</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Ciudad</th></tr>';
      lista.forEach(p => html += `<tr><td>${p.nitProveedor}</td><td>${p.nombreProveedor}</td><td>${p.direccionProveedor}</td><td>${p.telefonoProveedor}</td><td>${p.ciudadProveedor}</td></tr>`);
      html += '</table>';
      document.getElementById('tablaResultado').innerHTML = html;
    }
  </script>
</body>
</html>
