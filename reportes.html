<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tienda Genérica - Reportes</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="banner-demo">Modo demo (sin backend ni AWS) — los datos viven en este navegador</div>
  <div class="topbar">
    <h1>Tienda Genérica</h1>
    <nav>
      <a href="usuarios.html">Usuarios</a>
      <a href="clientes.html">Clientes</a>
      <a href="proveedores.html">Proveedores</a>
      <a href="productos.html">Productos</a>
      <a href="ventas.html">Ventas</a>
      <a href="reportes.html" class="active">Reportes</a>
      <a href="index.html">Salir</a>
    </nav>
  </div>

  <div class="container">
    <h2>Reportes</h2>
    <button onclick="listadoUsuarios()">Listado de Usuarios</button>
    <button onclick="listadoClientes()">Listado de Clientes</button>
    <button onclick="ventasPorCliente()">Ventas por Cliente</button>

    <div id="titulo"></div>
    <div id="mensaje"></div>
    <div id="tablaResultado"></div>
  </div>

  <script src="js/db.js"></script>
  <script>
    function mostrarMensaje(texto, tipo) {
      document.getElementById('mensaje').innerHTML = texto ? `<div class="msg ${tipo}">${texto}</div>` : '';
    }

    function listadoUsuarios() {
      document.getElementById('titulo').innerHTML = '<h3>Listado de Usuarios</h3>';
      const lista = DB.get(DB.KEYS.usuarios);
      if (!lista.length) { mostrarMensaje('No existen usuarios registrados', 'error'); document.getElementById('tablaResultado').innerHTML=''; return; }
      mostrarMensaje('', '');
      let html = '<table><tr><th>Cédula</th><th>Nombre</th><th>Correo Electrónico</th><th>Usuario</th><th>Password</th></tr>';
      lista.forEach(u => html += `<tr><td>${u.cedulaUsuario}</td><td>${u.nombreUsuario}</td><td>${u.emailUsuario}</td><td>${u.usuario}</td><td>${u.password}</td></tr>`);
      html += '</table>';
      document.getElementById('tablaResultado').innerHTML = html;
    }

    function listadoClientes() {
      document.getElementById('titulo').innerHTML = '<h3>Listado de Clientes</h3>';
      const lista = DB.get(DB.KEYS.clientes);
      if (!lista.length) { mostrarMensaje('No existen clientes registrados', 'error'); document.getElementById('tablaResultado').innerHTML=''; return; }
      mostrarMensaje('', '');
      let html = '<table><tr><th>Cédula</th><th>Nombre</th><th>Correo</th><th>Dirección</th><th>Teléfono</th></tr>';
      lista.forEach(c => html += `<tr><td>${c.cedulaCliente}</td><td>${c.nombreCliente}</td><td>${c.emailCliente}</td><td>${c.direccionCliente}</td><td>${c.telefonoCliente}</td></tr>`);
      html += '</table>';
      document.getElementById('tablaResultado').innerHTML = html;
    }

    function ventasPorCliente() {
      document.getElementById('titulo').innerHTML = '<h3>Total de Ventas por Cliente</h3>';
      const clientes = DB.get(DB.KEYS.clientes);
      const ventas = DB.get(DB.KEYS.ventas);
      if (!clientes.length) { mostrarMensaje('No existen clientes registrados', 'error'); document.getElementById('tablaResultado').innerHTML=''; return; }
      mostrarMensaje('', '');
      let html = '<table><tr><th>Cédula</th><th>Nombre</th><th>Valor Total Ventas</th></tr>';
      let totalGeneral = 0;
      clientes.forEach(c => {
        const totalCliente = ventas
          .filter(v => v.cedulaCliente === c.cedulaCliente)
          .reduce((acc, v) => acc + (v.totalVenta || 0), 0);
        html += `<tr><td>${c.cedulaCliente}</td><td>${c.nombreCliente}</td><td>${totalCliente.toFixed(2)}</td></tr>`;
        totalGeneral += totalCliente;
      });
      html += '</table>';
      html += `<p><b>Total Ventas $ ${totalGeneral.toFixed(2)}</b></p>`;
      document.getElementById('tablaResultado').innerHTML = html;
    }
  </script>
</body>
</html>
