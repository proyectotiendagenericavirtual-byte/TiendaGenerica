<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tienda Genérica - Usuarios</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="banner-demo">Modo demo (sin backend ni AWS) — los datos viven en este navegador</div>
  <div class="topbar">
    <h1>Tienda Genérica</h1>
    <nav>
      <a href="usuarios.html" class="active">Usuarios</a>
      <a href="clientes.html">Clientes</a>
      <a href="proveedores.html">Proveedores</a>
      <a href="productos.html">Productos</a>
      <a href="ventas.html">Ventas</a>
      <a href="reportes.html">Reportes</a>
      <a href="index.html">Salir</a>
    </nav>
  </div>

  <div class="container">
    <h2>Gestión de Usuarios</h2>

    <label>Cédula</label>
    <input type="text" id="cedulaUsuario"><br>
    <label>Nombre Completo</label>
    <input type="text" id="nombreUsuario"><br>
    <label>Correo Electrónico</label>
    <input type="text" id="emailUsuario"><br>
    <label>Usuario</label>
    <input type="text" id="usuario"><br>
    <label>Password</label>
    <input type="text" id="password"><br>

    <button onclick="consultar()">Consultar</button>
    <button onclick="crear()">Crear</button>
    <button onclick="actualizar()">Actualizar</button>
    <button onclick="borrar()">Borrar</button>
    <button onclick="listar()">Listar Usuarios</button>

    <div id="mensaje"></div>
    <div id="tablaResultado"></div>
  </div>

  <script src="js/db.js"></script>
  <script>
    function limpiar() {
      ['cedulaUsuario','nombreUsuario','emailUsuario','usuario','password'].forEach(id => {
        document.getElementById(id).value = '';
      });
    }
    function mostrarMensaje(texto, tipo) {
      document.getElementById('mensaje').innerHTML = texto ? `<div class="msg ${tipo}">${texto}</div>` : '';
    }
    function armarObjeto() {
      return {
        cedulaUsuario: Number(document.getElementById('cedulaUsuario').value),
        nombreUsuario: document.getElementById('nombreUsuario').value,
        emailUsuario: document.getElementById('emailUsuario').value,
        usuario: document.getElementById('usuario').value,
        password: document.getElementById('password').value
      };
    }

    function crear() {
      const u = armarObjeto();
      if (!u.cedulaUsuario || !u.nombreUsuario || !u.emailUsuario || !u.usuario || !u.password) {
        mostrarMensaje('Faltan datos del usuario', 'error'); return;
      }
      const lista = DB.get(DB.KEYS.usuarios);
      if (lista.some(x => x.cedulaUsuario === u.cedulaUsuario)) {
        mostrarMensaje('Ya existe un usuario con esa cédula', 'error'); return;
      }
      lista.push(u);
      DB.set(DB.KEYS.usuarios, lista);
      mostrarMensaje('Usuario Creado', 'ok');
      limpiar();
    }

    function consultar() {
      const cedula = document.getElementById('cedulaUsuario').value;
      if (!cedula) { mostrarMensaje('Ingrese la cédula a consultar', 'error'); return; }
      const lista = DB.get(DB.KEYS.usuarios);
      const encontrado = lista.find(x => String(x.cedulaUsuario) === String(cedula));
      if (encontrado) {
        document.getElementById('nombreUsuario').value = encontrado.nombreUsuario || '';
        document.getElementById('emailUsuario').value = encontrado.emailUsuario || '';
        document.getElementById('usuario').value = encontrado.usuario || '';
        document.getElementById('password').value = encontrado.password || '';
        mostrarMensaje('Usuario encontrado', 'ok');
      } else {
        mostrarMensaje('Usuario Inexistente', 'error');
      }
    }

    function actualizar() {
      const u = armarObjeto();
      if (!u.cedulaUsuario || !u.nombreUsuario || !u.emailUsuario || !u.usuario || !u.password) {
        mostrarMensaje('Datos faltantes', 'error'); return;
      }
      let lista = DB.get(DB.KEYS.usuarios);
      const idx = lista.findIndex(x => x.cedulaUsuario === u.cedulaUsuario);
      if (idx === -1) { mostrarMensaje('Cédula Errada', 'error'); return; }
      lista[idx] = u;
      DB.set(DB.KEYS.usuarios, lista);
      mostrarMensaje('Datos del Usuario Actualizados', 'ok');
      limpiar();
    }

    function borrar() {
      const cedula = document.getElementById('cedulaUsuario').value;
      let lista = DB.get(DB.KEYS.usuarios);
      const existe = lista.some(x => String(x.cedulaUsuario) === String(cedula));
      if (!existe) { mostrarMensaje('Cédula Errada', 'error'); return; }
      lista = lista.filter(x => String(x.cedulaUsuario) !== String(cedula));
      DB.set(DB.KEYS.usuarios, lista);
      mostrarMensaje('Datos del Usuario Borrados', 'ok');
      limpiar();
    }

    function listar() {
      const lista = DB.get(DB.KEYS.usuarios);
      if (!lista.length) { mostrarMensaje('No existen usuarios registrados', 'error'); document.getElementById('tablaResultado').innerHTML=''; return; }
      mostrarMensaje('', '');
      let html = '<table><tr><th>Cédula</th><th>Nombre</th><th>Correo</th><th>Usuario</th><th>Password</th></tr>';
      lista.forEach(u => html += `<tr><td>${u.cedulaUsuario}</td><td>${u.nombreUsuario}</td><td>${u.emailUsuario}</td><td>${u.usuario}</td><td>${u.password}</td></tr>`);
      html += '</table>';
      document.getElementById('tablaResultado').innerHTML = html;
    }
  </script>
</body>
</html>
